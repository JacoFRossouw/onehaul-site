<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Oneone Haul</title>
<meta name="description" content="Oneone Haul. Moving earth, as one. Coming soon.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: logo mark beside the pitch on wide screens, stacked on phones; a quiet three-point strip below. Single light look, matching the logo. */
  :root {
    --bg: #f3f4f6;
    --surface: #ffffff;
    --ink: #1b1d22;
    --muted: #5d6474;
    --line: #dfe2e8;
    --orange: #ff7a00;
    --orange-text: #b95600;
    --orange-soft: #fff1e3;
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
    padding-block: 28px 32px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .domain { font-weight: 700; letter-spacing: -0.01em; }
  .status {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--orange-text); background: var(--orange-soft);
    padding: 6px 12px; border-radius: 999px;
  }
  .status::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.35; } }

  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 28px;
    padding-bottom: 6vh;
  }
  .mark { width: 100%; max-width: 380px; height: auto; }
  .mark .spin { transform-origin: 384px 815px; animation: turn 1.2s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes turn { from { transform: rotate(-25deg); } to { transform: rotate(0); } }

  .pitch { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }
  h1 {
    margin: 0;
    font-size: clamp(34px, 5.2vw, 58px);
    line-height: 1.04;
    letter-spacing: -0.035em;
    font-weight: 800;
    text-wrap: balance;
  }
  h1 em { font-style: normal; color: var(--orange); }
  .lede { margin: 0; font-size: 18px; color: var(--muted); max-width: 52ch; }
  .tagline { margin: 0; text-align: center; font-size: clamp(20px, 2.4vw, 26px); font-weight: 500; color: var(--muted); }
  .tagline strong { color: var(--orange-text); font-weight: 700; }

  .points {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;
  }
  .points li {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px; display: flex; flex-direction: column; gap: 4px;
  }
  .points .k { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange-text); }
  .points .t { font-weight: 700; font-size: 17px; }
  .points .d { color: var(--muted); font-size: 15px; }
  .points li.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
  .points li.dark .k { color: #ffb066; }
  .points li.dark .d { color: #c2c7d1; }

  footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 20px; }
  footer i { font-style: normal; color: var(--ink); font-weight: 600; }

  @media (max-width: 600px) {
    .mark { max-width: 260px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .status::before, .mark .spin { animation: none; }
  }
</style>

<div class="wrap">
  <header>
    <span class="domain">onehaul.co.nz</span>
    <span class="status">Coming soon</span>
  </header>

  <main class="hero">
    <svg class="mark" viewBox="100 495 570 640" role="img" aria-labelledby="logo-title">
      <title id="logo-title">Oneone Haul logo</title>
      <g class="spin">
        <path d="M127.9 678.9 A290 290 0 0 1 599.5 621.0" fill="none" stroke="#1b1d22" stroke-width="34" stroke-linecap="round"/>
        <polygon points="644.7,687.9 560.3,645.0 636.5,593.6" fill="#1b1d22" stroke="#1b1d22" stroke-width="8" stroke-linejoin="round"/>
        <path d="M640.1 951.1 A290 290 0 0 1 168.5 1009.0" fill="none" stroke="#ff7a00" stroke-width="34" stroke-linecap="round"/>
        <polygon points="123.3,942.1 207.7,985.0 131.5,1036.4" fill="#ff7a00" stroke="#ff7a00" stroke-width="8" stroke-linejoin="round"/>
      </g>
      <text x="384" y="838" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="700" font-size="150" letter-spacing="-6"><tspan fill="#1b1d22">One</tspan><tspan fill="#ff7a00">one</tspan></text>
      <text x="384" y="928" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="50" letter-spacing="26" fill="#5d6474">HAUL</text>
    </svg>

    <p class="tagline">Moving earth, <strong>as one</strong>.</p>
  </main>

</div>

</body></html>
